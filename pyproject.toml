[project]
name = "jevrake"
version = "0.1.2"
description = "Selector-free web scraping powered by TypeSafe AI's Jev"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RKasai127" }]
keywords = ["scraping", "web-scraping", "llm", "pydantic", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx", "selectolax>=1.0", "typesafe-sdk"]

[project.urls]
Homepage = "https://github.com/RKasai127/jevrake"
Repository = "https://github.com/RKasai127/jevrake"
Issues = "https://github.com/RKasai127/jevrake/issues"

[project.scripts]
jevrake = "jevrake.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
# Full-width punctuation is normal in Japanese messages.
allowed-confusables = ["（", "）", "：", "，"]

[tool.ruff.lint.per-file-ignores]
# Tests use full-width digits on purpose (Japanese price / date inputs).
"tests/**" = ["RUF001"]
